<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/images/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="MUSTASHISM">
  <title>Select Your License - MUSTASHISM</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Select Your License - MUSTASHISM">
  <meta property="og:description" content="Official mustache licenses. A quiet resistance against plastic masculinity.">
  <meta property="og:image" content="/assets/images/og-image.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="537">
  <meta property="og:image:alt" content="Get Mustache License — MUSTASHISM">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Select Your License - MUSTASHISM">
  <meta name="twitter:description" content="Official mustache licenses. A quiet resistance against plastic masculinity.">
  <meta name="twitter:image" content="/assets/images/og-image.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/clarity.js" defer></script>
</head>
<body>
  <!-- Back Button - Top Left Sticky -->
  <div class="back-button-container">
    <a href="/index.html" class="btn-back">Back</a>
  </div>

  <!-- Step Indicator -->
  <div class="step-indicator step-indicator-top">
    <div class="step-item completed active">
      <div class="step-number">1</div>
      <div class="step-label">Select License</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item">
      <div class="step-number">2</div>
      <div class="step-label">Personal Info</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item">
      <div class="step-number">3</div>
      <div class="step-label">Payment</div>
    </div>
  </div>

  <main class="main-content">
    <div class="page-container">
      <!-- Search -->
      <div class="search-container">
        <input 
          type="text" 
          id="license-search" 
          class="search-input" 
          placeholder="Enter your license number (e.g. 000 020 or 20)"
          autocomplete="off"
        >
      </div>

      <!-- Category Filters -->
      <div class="filters-wrapper">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="cinema-film">Cinema</button>
          <button class="filter-btn" data-filter="music-audio">Music</button>
          <button class="filter-btn" data-filter="art-design">Art</button>
          <button class="filter-btn" data-filter="historical-dates">History</button>
          <button class="filter-btn" data-filter="cultural-symbolic">Culture</button>
          <button class="filter-btn" data-filter="technology-computing">Tech</button>
          <button class="filter-btn" data-filter="sports-games">Sports</button>
          <button class="filter-btn" data-filter="philosophy-literature">Philosophy</button>
          <button class="filter-btn" data-filter="gaming-internet">Gaming</button>
          <button class="filter-btn" data-filter="mathematical-constants">Math</button>
          <button class="filter-btn" data-filter="physics-constants">Physics</button>
          <button class="filter-btn" data-filter="astronomy-constants">Astronomy</button>
          <button class="filter-btn" data-filter="chemistry-constants">Chemistry</button>
          <button class="filter-btn" data-filter="reserved">Reserved</button>
        </div>
      </div>

      <!-- License Grid -->
      <div id="license-grid" class="license-grid">
        <div class="loading-state">Loading licenses...</div>
      </div>

      <!-- Load More Button -->
      <div class="load-more-container">
        <button id="load-more-btn" class="btn-secondary hidden">Load More</button>
      </div>
    </div>
  </main>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    // Category to numbers mapping
    const categoryNumbers = {
      'all': null, // null means show all
      'cinema-film': ['000007', '000012', '000013', '000021', '000027', '000042', '000088', '000101', '000451', '000666', '001984', '002001', '002046'],
      'music-audio': ['000012', '000033', '000045', '000078', '000432', '000440', '000808'],
      'art-design': ['000072', '000300'],
      'historical-dates': ['001066', '001492', '001776', '001914', '001945', '001969', '001989', '002001'],
      'cultural-symbolic': ['000003', '000007', '000012', '000040', '000100', '000144', '000360', '001000'],
      'technology-computing': ['000008', '000016', '000032', '000064', '001024', '002048'],
      'sports-games': ['000009', '000018', '000024', '000090'],
      'philosophy-literature': ['000023', '000073', '000108', '144000'],
      'gaming-internet': ['000404', '000420', '001337', '080085'],
      'mathematical-constants': ['000003', '000002', '000001', '000000', '000002'],
      'physics-constants': ['299792', '000006', '000006', '000001', '000001'],
      'astronomy-constants': ['149597', '000001', '000070'],
      'chemistry-constants': ['602214', '000008', '096485'],
      'reserved': ['000001', '000002', '000003', '000004', '000005', '000006', '000007', '000008', '000009', '000010', '000042', '000069', '000100', '000777', '001000', '002024']
    }

    // Category display names
    const categoryNames = {
      'cinema-film': 'Cinema',
      'music-audio': 'Music',
      'art-design': 'Art',
      'historical-dates': 'History',
      'cultural-symbolic': 'Culture',
      'technology-computing': 'Tech',
      'sports-games': 'Sports',
      'philosophy-literature': 'Philosophy',
      'gaming-internet': 'Gaming',
      'mathematical-constants': 'Math',
      'physics-constants': 'Physics',
      'astronomy-constants': 'Astronomy',
      'chemistry-constants': 'Chemistry',
      'reserved': 'Reserved'
    }

    // Create reverse mapping: number -> categories (for labels)
    const numberToCategories = {}
    Object.keys(categoryNumbers).forEach(category => {
      if (categoryNumbers[category]) {
        categoryNumbers[category].forEach(num => {
          if (!numberToCategories[num]) {
            numberToCategories[num] = []
          }
          numberToCategories[num].push(category)
        })
      }
    })

    let currentFilter = 'all'
    let currentOffset = 0
    const limit = 100 // Increased batch size for faster loading
    let hasMore = true
    let allLicenses = [] // Store all loaded licenses for client-side filtering
    let searchQuery = ''

    const licenseGrid = document.getElementById('license-grid')
    const loadMoreBtn = document.getElementById('load-more-btn')
    const filterBtns = document.querySelectorAll('.filter-btn')
    const searchInput = document.getElementById('license-search')

    function renderLicense(license, showCategoryLabel = false) {
      const licenseCard = document.createElement('div')
      licenseCard.className = 'license-card'
      licenseCard.dataset.licenseNumber = license.number
      licenseCard.dataset.status = license.status
      licenseCard.dataset.priceTier = license.priceTier
      
      const isPremium = license.priceTier === 'premium'
      const isAvailable = license.status === 'available'
      
      // Get category label if showing "All" category
      let categoryLabel = ''
      if (showCategoryLabel && currentFilter === 'all') {
        const licenseNum = getLicenseNumber(license.number)
        const categories = numberToCategories[licenseNum]
        if (categories && categories.length > 0) {
          // Show the first category (or primary category)
          const primaryCategory = categories[0]
          categoryLabel = `<div class="license-card-category">${categoryNames[primaryCategory] || primaryCategory}</div>`
        }
      }
      
      licenseCard.innerHTML = `
        <div class="license-card-number">${license.number}</div>
        <div class="license-card-price">${window.Utils.formatCurrency(license.price)}</div>
        ${categoryLabel}
        ${isPremium ? '<div class="license-card-badge">Premium</div>' : ''}
        ${!isAvailable ? '<div class="license-card-status">${license.status}</div>' : ''}
      `
      
      if (isAvailable) {
        licenseCard.classList.add('available')
        licenseCard.addEventListener('click', () => {
          sessionStorage.setItem('selectedLicense', JSON.stringify(license))
          window.location.href = `/personal-info.html?license=${encodeURIComponent(license.number)}`
        })
      } else {
        licenseCard.classList.add('unavailable')
      }
      
      return licenseCard
    }

    async function loadLicenses(reset = false) {
      if (reset) {
        currentOffset = 0
        hasMore = true
        licenseGrid.innerHTML = '<div class="loading-state">Loading licenses...</div>'
      }

      if (!hasMore) return

      try {
        const result = await window.API.fetchLicenses({
          status: 'available',
          limit,
          offset: currentOffset,
        })

        if (reset) {
          licenseGrid.innerHTML = ''
        }

        if (result.licenses && result.licenses.length > 0) {
          // Store licenses for client-side filtering
          if (reset) {
            allLicenses = []
          }
          allLicenses.push(...result.licenses)

          currentOffset += result.licenses.length
          hasMore = result.licenses.length === limit
          
          // Apply filters and search
          applyFiltersAndSearch()
          
          // If filtering by a specific category, ensure we load enough licenses
          if (currentFilter !== 'all' && hasMore) {
            const categoryNums = categoryNumbers[currentFilter]
            if (categoryNums) {
              // Find the maximum number in this category to know how many licenses we need
              const maxCategoryNum = Math.max(...categoryNums.map(n => parseInt(n)))
              
              // Check how many matches we've found
              const foundMatches = allLicenses.filter(license => {
                const licenseNum = getLicenseNumber(license.number)
                return license.status === 'available' && categoryNums.includes(licenseNum)
              })
              
              // Continue loading if:
              // 1. We haven't loaded enough licenses to cover the max number in this category
              // 2. We haven't found all the numbers in this category yet
              // 3. We haven't exceeded the total available licenses (9999)
              const shouldContinueLoading = 
                (currentOffset < maxCategoryNum || foundMatches.length < categoryNums.length) && 
                currentOffset < 10000
              
              if (shouldContinueLoading) {
                setTimeout(() => loadLicenses(false), 100)
                return
              }
            }
          }
        } else {
          hasMore = false
          loadMoreBtn.classList.add('hidden')
          if (licenseGrid.children.length === 0) {
            licenseGrid.innerHTML = '<div class="empty-state">No licenses found</div>'
          }
        }
      } catch (error) {
        console.error('Error loading licenses:', error)
        licenseGrid.innerHTML = `<div class="error-state">Error loading licenses: ${error.message}</div>`
      }
    }

    // Normalize to 6 digits for category matching (000 020 / 000-020 -> 000020)
    function getLicenseNumber(licenseNumber) {
      const s = String(licenseNumber).trim()
      const grouped = /^(\d{3})[-\s](\d{3})$/.exec(s)
      if (grouped) return grouped[1] + grouped[2]
      let num = s.replace(/^M-?/i, '').replace(/[-\s]/g, '')
      const actualNum = num.replace(/^0+/, '') || '0'
      return actualNum.padStart(6, '0')
    }
    

    // Filter and search function
    function applyFiltersAndSearch() {
      licenseGrid.innerHTML = ''
      
      // Get numbers for current category
      const categoryNums = categoryNumbers[currentFilter]
      
      // Debug: Log category info
      if (currentFilter !== 'all' && categoryNums) {
        const foundMatches = allLicenses.filter(license => {
          if (license.status !== 'available') return false
          const licenseNum = getLicenseNumber(license.number)
          return categoryNums.includes(licenseNum)
        })
        console.log(`[${currentFilter}] Found ${foundMatches.length}/${categoryNums.length} matches out of ${allLicenses.length} loaded licenses (offset: ${currentOffset})`)
        if (foundMatches.length > 0) {
          console.log(`Matches:`, foundMatches.map(l => `${l.number} -> ${getLicenseNumber(l.number)}`))
        }
        if (foundMatches.length < categoryNums.length) {
          const missing = categoryNums.filter(catNum => {
            return !foundMatches.some(m => getLicenseNumber(m.number) === catNum)
          })
          console.log(`Missing:`, missing.slice(0, 10))
        }
      }
      
      let filteredLicenses = allLicenses.filter(license => {
        // Only show available licenses
        if (license.status !== 'available') {
          return false
        }

        // Apply category filter
        let matchesFilter = true
        if (categoryNums !== null) {
          // Filter by category numbers
          const licenseNum = getLicenseNumber(license.number)
          matchesFilter = categoryNums.includes(licenseNum)
          
        }

        // Apply search (only searches within selected category since matchesFilter already filters by category)
        let matchesSearch = true
        if (searchQuery.trim()) {
          const query = searchQuery.trim().toLowerCase()
          const licenseNum = license.number.toLowerCase()
          // Match 000 020, 000-020, 000020, 20, or legacy M-0020
          const q = query.replace(/[-\s]/g, '')
          matchesSearch = licenseNum.includes(query) ||
                         licenseNum.replace(/^m-?/i, '').replace(/[-\s]/g, '').includes(q.replace(/^0+/, '')) ||
                         getLicenseNumber(license.number).includes(q)
        }

        return matchesFilter && matchesSearch
      })

      if (filteredLicenses.length === 0) {
        licenseGrid.innerHTML = '<div class="empty-state">No licenses found</div>'
        loadMoreBtn.classList.add('hidden')
      } else {
        filteredLicenses.forEach(license => {
          licenseGrid.appendChild(renderLicense(license, true))
        })
        
        // Show load more only if we have more data, search is empty, and filter is "all"
        if (hasMore && !searchQuery.trim() && currentFilter === 'all') {
          loadMoreBtn.classList.remove('hidden')
        } else {
          loadMoreBtn.classList.add('hidden')
        }
      }
    }

    // Search input handler
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value
      applyFiltersAndSearch()
    })

    // Filter buttons
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        currentFilter = btn.dataset.filter
        
        // If filtering by a specific category, ensure we load enough licenses
        if (currentFilter !== 'all') {
          const categoryNums = categoryNumbers[currentFilter]
          if (categoryNums) {
            // Find the highest number in this category to determine how many licenses we need
            const maxNum = Math.max(...categoryNums.map(n => parseInt(n)))
            // If max number is > current loaded range, load more
            if (maxNum > allLicenses.length || allLicenses.length === 0) {
              // Reset and load from beginning
              currentOffset = 0
              hasMore = true
              loadLicenses(true)
              return
            }
          }
        }
        
        // If we have licenses loaded, just filter them
        if (allLicenses.length > 0) {
          applyFiltersAndSearch()
        } else {
          loadLicenses(true)
        }
      })
    })

    // Load more button
    loadMoreBtn.addEventListener('click', () => {
      loadLicenses(false)
    })

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
      loadLicenses(true)
    })
  </script>
</body>
</html>
