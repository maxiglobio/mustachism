<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/images/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="MUSTASHISM">
  <title>Dashboard - MUSTASHISM</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dashboard - MUSTASHISM">
  <meta property="og:description" content="Official mustache licenses. A quiet resistance against plastic masculinity.">
  <meta property="og:image" content="/assets/images/og-image.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="537">
  <meta property="og:image:alt" content="Get Mustache License — MUSTASHISM">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dashboard - MUSTASHISM">
  <meta name="twitter:description" content="Official mustache licenses. A quiet resistance against plastic masculinity.">
  <meta name="twitter:image" content="/assets/images/og-image.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/clarity.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="sticky-logo-link">
      <img src="/assets/images/logo.svg" alt="" class="sticky-logo-img">
      <span class="sticky-logo-text">MUSTACHISM</span>
    </a>
    <nav class="header-tabs">
      <a href="/" class="header-tab active" data-tab="license">License</a>
      <span class="header-tab-sep">/</span>
      <a href="/story.html" class="header-tab" data-tab="story">Story</a>
    </nav>
    <div class="login-button-container">
      <button type="button" id="logout-btn" class="btn-login">Logout</button>
    </div>
  </header>

  <main class="main-content">
    <div class="page-container dashboard-page">
      <header class="dashboard-page-header">
        <h1 class="dashboard-title">Your dashboard</h1>
        <p class="dashboard-lead font-typewriter">Licenses tied to your account.</p>
      </header>

      <div id="dashboard-content" class="dashboard-content">
        <div class="dashboard-loader" role="status" aria-live="polite">
          <span class="dashboard-loader-spinner" aria-hidden="true"></span>
          <p class="dashboard-loader-text font-typewriter">Loading your licenses…</p>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-content">
          <div class="footer-copyright">
            © <span id="current-year"></span> MUSTASHISM. All rights reserved.
          </div>
          <div class="footer-links">
            <a href="/privacy-policy.html">Privacy Policy</a>
            <a href="/terms-of-service.html">Terms of Service</a>
            <a href="#">Contact</a>
          </div>
        </div>
      </div>
    </footer>
  </main>

  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const yearSpan = document.getElementById('current-year')
      if (yearSpan) yearSpan.textContent = String(new Date().getFullYear())

      const [authSettled, licSettled] = await Promise.allSettled([
        window.Auth.initAuth(),
        window.API.fetchUserLicenses(),
      ])
      if (authSettled.status === 'rejected') {
        console.warn('Auth check failed:', authSettled.reason)
      }

      const authState = window.Auth.getAuthState()
      if (!authState.authenticated) {
        window.location.href = '/login.html'
        return
      }

      let licensesPayload =
        licSettled.status === 'fulfilled'
          ? licSettled.value
          : await window.API.fetchUserLicenses()

      loadDashboard(licensesPayload)
    })

    async function loadDashboard(preloaded) {
      const dashboardContent = document.getElementById('dashboard-content')

      try {
        const { licenses } =
          preloaded && Array.isArray(preloaded.licenses)
            ? preloaded
            : await window.API.fetchUserLicenses()

        if (!licenses || licenses.length === 0) {
          dashboardContent.innerHTML = `
            <div class="dashboard-card dashboard-card--empty">
              <h2 class="dashboard-card-heading">No licenses yet</h2>
              <p class="dashboard-card-body">You haven’t purchased a mustache license yet.</p>
              <a href="/license-select.html" class="btn-primary btn-large dashboard-card-cta">Get your license</a>
            </div>
          `
          return
        }

        const licensesHtml = licenses.map(license => {
          const issueDate = license.issueDate
            ? new Date(license.issueDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            : 'N/A'
          return `
            <article class="dashboard-license-card">
              <div class="dashboard-license-card__info">
                <h2 class="dashboard-license-number">${license.licenseNumber}</h2>
                <dl class="dashboard-license-meta font-typewriter">
                  <div class="dashboard-license-row"><dt>Status</dt><dd>${license.status}</dd></div>
                  <div class="dashboard-license-row"><dt>Issue date</dt><dd>${issueDate}</dd></div>
                  <div class="dashboard-license-row"><dt>Price paid</dt><dd>$${license.pricePaid?.toFixed(2) || '0.00'}</dd></div>
                  ${license.fullName ? `<div class="dashboard-license-row"><dt>Name</dt><dd>${license.fullName}</dd></div>` : ''}
                </dl>
              </div>
            </article>
          `
        }).join('')

        dashboardContent.innerHTML = `
          <div class="dashboard-summary font-typewriter">
            <span class="dashboard-summary-label">Total</span>
            <span class="dashboard-summary-value">${licenses.length} license${licenses.length > 1 ? 's' : ''}</span>
          </div>
          <div class="dashboard-license-grid">
            ${licensesHtml}
          </div>
        `
      } catch (error) {
        console.error('Error loading dashboard:', error)
        dashboardContent.innerHTML = `
          <div class="dashboard-error error-state" role="alert">
            <p class="dashboard-error-title">Couldn’t load dashboard</p>
            <p class="dashboard-error-detail">${error.message}</p>
          </div>
        `
      }
    }

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      try {
        await window.Auth.logout()
        window.location.href = '/index.html'
      } catch (error) {
        console.error('Logout error:', error)
        window.location.href = '/index.html'
      }
    })
  </script>
</body>
</html>
